name: Build, Test, and Push Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CustomerService.sln

      - name: Build
        run: dotnet build CustomerService.sln --no-restore -c Release

      - name: Run tests
        run: dotnet test CustomerService.sln --no-build -c Release --verbosity normal

  migrate-database:
    name: Apply Database Migrations
    needs: test
    runs-on: ubuntu-latest
    # Only run against the real database on actual pushes to main, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef

      - name: Restore dependencies
        run: dotnet restore CustomerService.sln

      - name: Apply migrations to Azure SQL
        env:
          ConnectionStrings__CustDb: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        run: |
          dotnet ef database update \
            --project src/CustomerService.Infrastructure \
            --startup-project src/CustomerService.API

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    # Only push on actual pushes to main, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/customerservice-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/customerservice-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image tag output
        id: set_tag
        run: echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy-to-azure:
    name: Deploy to Azure Container Apps
    needs: [ migrate-database, build-and-push ]
    runs-on: ubuntu-latest
    # Only deploy on actual pushes to main, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # required for OIDC federated login, no stored password needed
      contents: read
    steps:
      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App with the new image
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name customerservice-api \
              --resource-group customerservice-rg \
              --image ${{ secrets.DOCKERHUB_USERNAME }}/customerservice-api:${{ needs.build-and-push.outputs.image_tag }}